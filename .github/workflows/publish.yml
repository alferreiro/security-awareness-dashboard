name: Render and publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - name: Verify the synthetic data regenerate identically (informational)
        continue-on-error: true
        run: |
          python scripts/generate_data.py --out /tmp/regen > /dev/null
          for f in /tmp/regen/*.csv; do
            cmp -s "$f" "data/$(basename "$f")" && echo "identical: $(basename "$f")" || echo "DIFFERS: $(basename "$f")"
          done

      - name: Rebuild tidy export tables
        run: python scripts/export_tidy.py --data data --out data/tidy

      - name: Render the Quarto dashboard
        run: quarto render dashboard

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
